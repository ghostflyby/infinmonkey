name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static checks / unit tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check packages
      - run: deno test -A
      - run: deno task unused
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e-firefox:
    name: E2E（Firefox / geckodriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Write CI browser config
        run: |
          cat > .browsers.local.json <<'JSON'
          { "browsers": { "firefox": { "binary": "/usr/bin/firefox" } } }
          JSON
      - name: Build
        run: deno run -A packages/tools/build.ts --browser firefox
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E smoke
        run: deno run -A packages/tools/e2e.ts --browser firefox --suite smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-firefox
          path: .e2e/

  e2e-chromium:
    name: E2E（Chrome for Testing / chromedriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # One-shot CI environment downloads a pinned CfT browser + driver (branded Chrome/Edge ignores --load-extension)
      - name: Set up CfT Chrome + chromedriver
        run: deno run -A packages/tools/setup-chromium.ts
      - name: Build
        run: deno run -A packages/tools/build.ts --browser chrome
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E full
        run: deno run -A packages/tools/e2e.ts --browser cft --suite full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-chromium
          path: .e2e/
