name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege; cancel superseded runs on the same ref.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks / unit tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno fmt --check
      - run: deno lint
      - run: deno check packages
      - run: deno test -A
      - run: deno task unused
      - run: deno task build
      # Keep the safari bundle from rotting (pure deno bundling, no Xcode needed)
      - run: deno task build:safari
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  native:
    name: Native (Swift package / macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Warm DerivedData for the xcodebuild step below. Key is per-run so every
      # job saves a fresh entry; restore-keys picks the newest previous entry,
      # and the action restores source mtimes so Xcode's incremental engine can
      # actually reuse the artifacts. Measured (2026-09-15, macos-latest):
      # xcodebuild 62s cold / 39s across-commit / 22s same-commit; native job
      # 142s uncached baseline / 125s cold / 75s same-commit warm. Restore is
      # ~5s and save ~10s, so the net is positive in every observed case.
      - name: Restore Xcode build cache
        uses: irgaly/xcode-cache@v1.9.2
        with:
          key: xcode-v1-${{ github.run_id }}
          restore-keys: xcode-v1-
          deriveddata-directory: .xcodebuild/DerivedData
      - name: Swift format lint
        run: deno task swift:lint
      - name: Swift package unit tests
        run: swift test --disable-sandbox
        working-directory: apple/InfinMonkeyCore
      # Compiles the app + extension + the local package through Xcode's graph.
      # Unsigned: CI verifies code, not provisioning.
      - name: Build macOS app and extension (unsigned)
        run: |
          start=$SECONDS
          xcodebuild -project InfinMonkey.xcodeproj -scheme "InfinMonkey (macOS)" \
            -destination "platform=macOS" -derivedDataPath .xcodebuild/DerivedData \
            build CODE_SIGNING_ALLOWED=NO
          echo "xcodebuild duration: $((SECONDS - start))s"

  e2e-firefox:
    name: E2E（Firefox / geckodriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Write CI browser config
        run: |
          cat > .browsers.local.json <<'JSON'
          { "browsers": { "firefox": { "binary": "/usr/bin/firefox" } } }
          JSON
      - name: Build
        run: deno run -A packages/tools/build.ts --browser firefox
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E smoke
        run: deno run -A packages/tools/e2e.ts --browser firefox --suite smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-firefox
          path: .e2e/

  e2e-chromium:
    name: E2E（Chrome for Testing / chromedriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      # Pinned Chrome for Testing + a chromedriver matched to it. A pinned
      # version number resolves through the CfT endpoints; the channel names
      # ("stable" etc.) resolve to BRANDED Chrome, which ignores
      # --load-extension since 137 (observed: extension silently absent).
      # Bump the pin deliberately when a new CfT stable is out.
      - name: Set up CfT Chrome + chromedriver
        id: cft
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 153.0.8010.36
          install-chromedriver: true
      - name: Write CI browser config
        run: |
          cat > .browsers.local.json <<JSON
          {
            "browsers": {
              "cft": {
                "kind": "chromium",
                "binary": "$CFT_CHROME",
                "driver": "$CFT_DRIVER"
              }
            }
          }
          JSON
        env:
          CFT_CHROME: ${{ steps.cft.outputs.chrome-path }}
          CFT_DRIVER: ${{ steps.cft.outputs.chromedriver-path }}
      - name: Build
        run: deno run -A packages/tools/build.ts --browser chrome
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E full
        run: deno run -A packages/tools/e2e.ts --browser cft --suite full
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-chromium
          path: .e2e/
