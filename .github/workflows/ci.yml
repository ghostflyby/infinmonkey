name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege; cancel superseded runs on the same ref.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks / unit tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check packages
      - run: deno test -A
      - run: deno task unused
      - run: deno task build
      # Keep the safari bundle from rotting (pure deno bundling, no Xcode needed)
      - run: deno task build:safari
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  native:
    name: Native (Swift package / macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Swift format lint
        run: deno task swift:lint
      - name: Swift package unit tests
        run: swift test --disable-sandbox
        working-directory: apple/InfinMonkeyCore
      # Compiles the app + extension + the local package through Xcode's graph.
      # Unsigned: CI verifies code, not provisioning.
      - name: Build macOS app and extension (unsigned)
        run: >
          xcodebuild -project InfinMonkey.xcodeproj -scheme "InfinMonkey (macOS)"
          -destination "platform=macOS" build CODE_SIGNING_ALLOWED=NO

  e2e-firefox:
    name: E2E（Firefox / geckodriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Write CI browser config
        run: |
          cat > .browsers.local.json <<'JSON'
          { "browsers": { "firefox": { "binary": "/usr/bin/firefox" } } }
          JSON
      - name: Build
        run: deno run -A packages/tools/build.ts --browser firefox
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E smoke
        run: deno run -A packages/tools/e2e.ts --browser firefox --suite smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-firefox
          path: .e2e/

  e2e-chromium:
    name: E2E（Chrome for Testing / chromedriver）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # One-shot CI environment downloads a pinned CfT browser + driver (branded Chrome/Edge ignores --load-extension)
      - name: Set up CfT Chrome + chromedriver
        run: deno run -A packages/tools/setup-chromium.ts
      - name: Build
        run: deno run -A packages/tools/build.ts --browser chrome
      - name: Start dev server
        run: |
          deno task devserver &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:17321/__infin/health && break; sleep 1; done
          curl -sf http://127.0.0.1:17321/__infin/health || { echo "devserver not ready"; exit 1; }
      - name: Run E2E full
        run: deno run -A packages/tools/e2e.ts --browser cft --suite full
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-chromium
          path: .e2e/
